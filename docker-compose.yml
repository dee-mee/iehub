services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iehub-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: iehub
      POSTGRES_USER: iehub
      POSTGRES_PASSWORD: iehub
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: iehubminio
      MINIO_SECRET_KEY: iehubminio123
      MINIO_MEDIA_BUCKET_NAME: iehub-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend:/app

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iehub-celery-worker
    command: celery -A ie_hub worker -l info
    env_file:
      - ./backend/.env.example
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: iehub
      POSTGRES_USER: iehub
      POSTGRES_PASSWORD: iehub
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iehub-celery-beat
    command: celery -A ie_hub beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env.example
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: iehub
      POSTGRES_USER: iehub
      POSTGRES_PASSWORD: iehub
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iehub-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_USERWAY_KEY: ${VITE_USERWAY_KEY:-}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgres:16
    container_name: iehub-postgres
    environment:
      POSTGRES_DB: iehub
      POSTGRES_USER: iehub
      POSTGRES_PASSWORD: iehub
    volumes:
      - iehub_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iehub -d iehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: iehub-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: iehub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: iehubminio
      MINIO_ROOT_PASSWORD: iehubminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - iehub_minio_data:/data

volumes:
  iehub_postgres_data:
  iehub_minio_data:
